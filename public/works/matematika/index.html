<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Математика, 1 четверть (4–5 классы)</title>
<style>
:root{--bg:#eef6ff;--card:#fff;--text:#1f2a44;--muted:#6b7794;--pri:#3b82f6;--ok:#22a06b;--bad:#e5484d;--line:#d6e2f5}
@media (prefers-color-scheme:dark){:root{--bg:#121a2b;--card:#1c2740;--text:#eaf0ff;--muted:#9aa7c7;--pri:#5b94f5;--line:#2e3c5e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px}
#app{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:24px;margin:8px 0;text-align:center}
.sub{color:var(--muted);text-align:center;margin:0 0 10px}.sub.l{text-align:left;margin:6px 0}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(40,70,140,.12)}
button{font:inherit;cursor:pointer;border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:12px 14px;margin:6px 0;width:100%}
button:active{transform:scale(.98)}
.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.ghost{width:auto;border:none;background:transparent;color:var(--pri);padding:6px 4px;margin:0}
.top{display:flex;justify-content:space-between}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>button{flex:1;min-width:30%}.sp{justify-content:space-between;align-items:center}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
.tp{display:flex;align-items:center;gap:12px;text-align:left;border-left:8px solid var(--c)}
.tp small{display:block;color:var(--muted)}.ic{font-size:30px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.q{font-size:22px;font-weight:700;margin:6px 0 12px;line-height:1.5}
input{font:inherit;font-size:22px;width:100%;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--text);text-align:center}
.box{border-radius:12px;padding:10px 12px;margin:10px 0;line-height:1.45}
.err{background:rgba(229,72,77,.15)}.good{background:rgba(34,160,107,.18)}.hint{background:rgba(245,165,36,.22)}.meta{background:rgba(59,130,246,.12);line-height:1.5}
.center{text-align:center}.big{font-size:56px}.msg{color:var(--bad);min-height:20px;font-size:15px;margin:4px 0}
.li{padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}.note{color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<script>
var KEY="mathTutor45V1",DL=[1,3,5],RANK=["Новичок","Исследователь","Знаток","Мастер","Профи"];
var TOP=[
{k:"num",n:"Числа и разряды",i:"🏠",c:"#3b82f6",t:"<b>Дом с этажами.</b> Каждый разряд — этаж: единицы, десятки, сотни, тысячи. Цифра говорит, сколько жильцов живёт на этаже. Больше 9 жильцов на этаже не бывает — 10 жильцов переезжают на этаж выше. Пустой этаж отмечаем нулём, чтобы не потерять номера этажей."},
{k:"addsub",n:"Сложение, вычитание, уравнения",i:"🎒",c:"#22a06b",t:"<b>Рюкзак.</b> Сложение — кладём вещи в рюкзак, вычитание — достаём. Столбиком работаем по этажам, начиная с единиц: если на этаже стало 10 и больше — переносим один на этаж выше; если не хватает — занимаем у соседа. В уравнении неизвестное x — вещь, спрятанная в рюкзаке: мы знаем, что было всего и что известно, и находим спрятанное."},
{k:"muldiv",n:"Умножение и деление",i:"📦",c:"#f59e0b",t:"<b>Коробки с конфетами.</b> 4 коробки по 6 конфет — это 4 × 6. Деление — наоборот: раздаём конфеты поровну. Большие числа умножаем по частям: сначала десятки, потом единицы. В примерах с несколькими действиями есть правило: сначала скобки, потом умножение и деление, и только потом сложение и вычитание."},
{k:"units",n:"Величины",i:"📏",c:"#8b5cf6",t:"<b>Матрёшки.</b> Большая единица состоит из нескольких маленьких: в километре — тысяча метров, в часе — 60 минут. Когда идём к маленькой матрёшке — чисел становится больше (умножаем). Когда собираем в большую — чисел меньше (делим)."}];
function R(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function PK(a){return a[R(0,a.length-1)]}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,"\u00a0")}
function pad(n){return n<10?"0"+n:""+n}
function AS(lo,hi){var a=R(lo,hi),b=R(lo,hi),add=Math.random()<.5,t;
 if(!add){if(a<b){t=a;a=b;b=t}if(a===b)a++}
 return{q:"Вычисли: "+fmt(a)+(add?" + ":" − ")+fmt(b)+".",a:[add?a+b:a-b,1],
  hint:add?"Складывай столбиком, начиная с единиц. Если на этаже получилось 10 и больше — перенеси один на этаж выше.":"Вычитай столбиком, начиная с единиц. Если не хватает — займи десяток (сотню) у соседнего разряда.",
  trap:{v:add?Math.abs(a-b):a+b,m:add?"Похоже, ты вычитал. Но в задании знак «+» — числа нужно сложить.":"Похоже, ты складывал. Но в задании знак «−» — нужно вычесть."}}}
function CV(list){var pr=PK(list),N=R(2,9),k=pr[2];
 return{q:"Сколько "+pr[1]+" в "+N+" "+pr[0]+"?",a:[N*k,1],hint:"В 1 "+pr[0]+" — "+k+" "+pr[1]+". Переходим к более мелкой единице: число вырастет, значит, умножаем.",
  trap:{v:N/k,m:"Мелких единиц больше, чем крупных, — число должно вырасти. Здесь нужно умножать."}}}
var U=[["км","м",1000],["м","см",100],["м","дм",10],["кг","г",1000],["т","кг",1000],["ч","мин",60],["мин","с",60],["сут","ч",24]];
var GEN={
num:function(l,g){var n,i,s,p,r,a,b,c,d,e;
 if(l===1){n=g===5?R(10000,99999):R(1000,9999);i=R(0,2);s=String(n);
  return{q:"Какая цифра стоит в разряде "+["единиц","десятков","сотен"][i]+" в числе "+fmt(n)+"?",a:[+s[s.length-1-i],1],hint:"Считай разряды справа налево: единицы, десятки, сотни, тысячи."}}
 if(l===2){n=g===5?R(10000,99999):R(1000,9999);
  return{q:"Сколько всего сотен в числе "+fmt(n)+"?",a:[Math.floor(n/100),1],hint:"Закрой две последние цифры — оставшееся число и покажет, сколько всего сотен.",trap:{v:Math.floor(n%1000/100),m:"Это цифра в разряде сотен. А «всего сотен» — это сколько сотен помещается во всём числе."}}}
 if(l===3){a=R(1,9);b=R(0,9);c=R(0,9);d=R(0,9);e=R(1,9);
  if(g===5)return{q:"Запиши число: десятков тысяч — "+e+", тысяч — "+a+", сотен — "+b+", десятков — "+c+", единиц — "+d+".",a:[e*10000+a*1000+b*100+c*10+d,1],hint:"Если разряд пустой (0), нуль всё равно нужно записать."}
  return{q:"Запиши число: тысяч — "+a+", сотен — "+b+", десятков — "+c+", единиц — "+d+".",a:[a*1000+b*100+c*10+d,1],hint:"Если разряд пустой (0), нуль всё равно нужно записать."}}
 if(l===4){p=g===5?1000:100;n=g===5?R(10001,99999):R(1001,9999);r=Math.round(n/p)*p;
  return{q:"Округли число "+fmt(n)+" до "+(g===5?"тысяч":"сотен")+".",a:[r,1],hint:"Посмотри на цифру справа от разряда, до которого округляешь: 5 и больше — округляем вверх, меньше 5 — вниз.",trap:{v:Math.floor(n/p)*p,m:"Ты просто отбросил цифры. Если следующая цифра 5 или больше, к числу нужно прибавить одну единицу этого разряда."}}}
 n=g===5?R(10,99)*1000+999:R(1,8)*1000+R(0,9)*100+99;
 return{q:"Какое число следует за числом "+fmt(n)+"?",a:[n+1,1],hint:"Прибавь 1 к единицам: 9 + 1 даёт 0 и переезд на этаж выше. Так вся цепочка девяток превращается в нули."}},
addsub:function(l,g){var x,a,d,s,k;
 if(l===1)return AS(11,59);
 if(l===2)return AS(150,499);
 if(l===3)return AS(400,999);
 if(l===4)return g===5?AS(12000,89999):AS(1200,8900);
 k=R(0,2);x=g===5?R(1200,9000):R(120,900);a=g===5?R(1200,9000):R(50,900);
 if(k===0){s=x+a;return{q:"Реши уравнение: x + "+fmt(a)+" = "+fmt(s)+".",a:[x,1],hint:"x — неизвестное слагаемое. Чтобы его найти, из суммы вычти известное слагаемое.",trap:{v:s+a,m:"Ты прибавил число к сумме. Чтобы найти слагаемое, нужно из суммы вычесть известное слагаемое."}}}
 if(k===1){d=x-a>0?x-a:x;s=a+d;return{q:"Реши уравнение: x − "+fmt(a)+" = "+fmt(d)+".",a:[s,1],hint:"x — уменьшаемое. Чтобы найти уменьшаемое, к разности прибавь вычитаемое.",trap:{v:d>a?d-a:0,m:"Чтобы найти уменьшаемое, нужно не вычитать, а прибавлять."}}}
 d=a;s=x+d;return{q:"Реши уравнение: "+fmt(s)+" − x = "+fmt(d)+".",a:[x,1],hint:"x — вычитаемое. Чтобы найти вычитаемое, из уменьшаемого вычти разность.",trap:{v:s+d,m:"Здесь x — вычитаемое: из уменьшаемого нужно вычесть разность."}}},
muldiv:function(l,g){var a,b,q,n,m,c,d,t;
 if(l===1){a=R(3,9);b=R(3,9);return Math.random()<.5?{q:"Вычисли: "+a+" × "+b+".",a:[a*b,1],hint:"Вспомни таблицу умножения. Можно прибавлять число "+a+" столько раз, сколько указано во втором множителе."}:{q:"Вычисли: "+a*b+" : "+a+".",a:[b,1],hint:"Подумай: на какое число нужно умножить "+a+", чтобы получить "+a*b+"?"}}
 if(l===2){a=g===5?R(120,499):R(12,49);b=R(3,9);return{q:"Вычисли: "+a+" × "+b+".",a:[a*b,1],hint:"Умножай по частям: сначала десятки (или сотни), потом единицы, и сложи результаты."}}
 if(l===3){b=R(3,9);q=g===5?R(120,999):R(25,150);return{q:"Вычисли: "+fmt(b*q)+" : "+b+".",a:[q,1],hint:"Дели по частям: сначала старший разряд, остаток переходит вниз. Проверь себя умножением."}}
 if(l===4){if(Math.random()<.5){n=R(6,9);m=g===5?R(25,95):R(12,48);return{q:"В "+n+" коробках лежит по "+m+" карандашей. Сколько всего карандашей?",a:[n*m,1],hint:"Одинаковые группы — это умножение: число коробок умножь на число карандашей в одной."}}
  n=R(4,9);m=g===5?R(25,95):R(12,48);return{q:fmt(n*m)+" конфет разложили поровну в "+n+" пакетов. Сколько конфет в одном пакете?",a:[m,1],hint:"Раздали поровну — это деление: все конфеты раздели на число пакетов."}}
 if(Math.random()<.5){a=R(5,40);b=R(2,9);c=R(2,9);d=g===5?R(1,a):0;
  return{q:"Вычисли: "+a+" + "+b+" × "+c+(d?" − "+d:"")+".",a:[a+b*c-d,1],hint:"Сначала умножение, и только потом сложение и вычитание — по порядку слева направо.",trap:{v:(a+b)*c-d,m:"Сначала выполняют умножение, а уже потом сложение и вычитание."}}}
 a=R(2,15);b=R(2,15);c=R(2,9);
 return{q:"Вычисли: ("+a+" + "+b+") × "+c+".",a:[(a+b)*c,1],hint:"Сначала считай то, что в скобках, а потом умножай.",trap:{v:a+b*c,m:"Скобки считают первыми: сначала нужно сложить числа в скобках."}}},
units:function(l,g){var pr,N,k,r,a,b,H,M,D,tt;
 if(l===1)return CV(U.slice(0,4));
 if(l===2)return CV(U.slice(4));
 if(l===3){pr=PK(U);k=pr[2];r=R(2,9);return{q:"Сколько "+pr[0]+" в "+fmt(r*k)+" "+pr[1]+"?",a:[r,1],hint:"Переходим к более крупной единице: число уменьшится, значит, делим на "+k+".",trap:{v:r*k*k,m:"Крупных единиц меньше, чем мелких, — здесь нужно делить, а не умножать."}}}
 if(l===4){pr=PK([U[0],U[3],U[5],U[1],U[4]]);k=pr[2];a=R(2,9);b=k===60?PK([10,15,20,25,30,45,50]):k===100?PK([10,20,25,40,50,75]):PK([100,250,300,450,500,750]);
  return{q:"Выразите в "+pr[1]+": "+a+" "+pr[0]+" "+b+" "+pr[1]+".",a:[a*k+b,1],hint:"Сначала переведи крупные единицы в мелкие, а потом прибавь остаток.",trap:{v:a+b,m:"Ты сложил числа, не переводя единицы. Сначала переведи "+pr[0]+" в "+pr[1]+"."}}}
 H=R(7,15);M=PK([10,15,20,30,40,45,50]);D=R(7,35)*5;tt=H*60+M+D;
 return{q:"Фильм начался в "+H+":"+pad(M)+", а закончился в "+Math.floor(tt/60)+":"+pad(tt%60)+". Сколько минут шёл фильм?",a:[D,1],hint:"Сколько минут до ближайшего целого часа? Потом добавь целые часы и оставшиеся минуты и переведи всё в минуты.",trap:{v:Math.abs(tt%60-M)+(Math.floor(tt/60)-H)*60,m:"Минуты нельзя просто вычитать: если минут не хватает, занимай час (60 минут)."}}}
};
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.p)return s}catch(e){}return{grade:4,topic:null,p:{},log:[],nid:1}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var S=load(),view="menu",showTopic=false,inputVal="",resetArm=false;
function key(){return S.grade+"-"+S.topic}
function PR(){return S.p[key()]}
function topic(k){return TOP.filter(function(t){return t.k===k})[0]}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function bar(p){return '<div class="bar"><i style="width:'+p+'%"></i></div>'}
function total(){var s=0;for(var k in S.p)s+=S.p[k].pts;return s}
function make(l,fl){var t=GEN[S.topic](l,S.grade);t.id=S.nid++;t.lvl=l;t.hintUsed=false;t.done=null;t.fb=null;for(var k in fl)t[k]=fl[k];return t}
function parse(s){s=s.trim().replace(",",".").replace(/\s+/g,"");if(/^-?\d+(\.\d+)?$/.test(s))return parseFloat(s);return null}
function same(v,a){return Math.abs(v-a[0]/a[1])<1e-6}
function keepInp(){var e=document.getElementById("inp");if(e)inputVal=e.value}
function go(v){if(view==="play")keepInp();view=v;resetArm=false;render()}
function setG(g){S.grade=g;save();render()}
function pickT(k){S.topic=k;if(!PR())S.p[key()]={pts:0,ok:0,total:0,lvl:1,streak:0,diag:{i:0,c:0},diagDone:false,cur:null};
 var P=PR();showTopic=false;inputVal="";
 if(P.cur)view="play";else if(P.diagDone){P.cur=make(P.lvl);view="play"}else view="intro";save();render()}
function startDiag(){var P=PR();P.cur=make(DL[P.diag.i],{diag:true});view="play";save();render()}
function startPlay(){var P=PR();P.cur=make(P.lvl);view="play";inputVal="";save();render()}
function hint(){keepInp();var c=PR().cur;if(c.done)return;c.hintUsed=true;save();render()}
function tog(){keepInp();showTopic=!showTopic;render()}
function submit(){
 var P=PR(),c=P.cur;if(!c||c.done)return;
 var raw=document.getElementById("inp").value,v=parse(raw);
 if(v===null){document.getElementById("msg").textContent="Введи число, например 125";return}
 if(S.log.some(function(e){return e.id===c.id}))return;
 var ok=same(v,c.a),pts=0;
 if(ok){pts=c.lvl*10;if(c.hintUsed||c.easy)pts=Math.round(pts/2);if(pts<1)pts=1;P.pts+=pts;P.ok++}
 P.total++;
 S.log.push({id:c.id,g:S.grade,tp:S.topic,q:c.q,giv:raw,ok:ok,pts:pts,t:Date.now()});
 if(S.log.length>300)S.log.shift();
 if(c.diag){if(ok)P.diag.c++;c.done={ok:ok,pts:pts}}
 else if(ok){var up=false;P.streak++;if(P.streak>=2){P.streak=0;if(P.lvl<5){P.lvl++;up=true}else up="max"}c.done={ok:true,pts:pts,up:up}}
 else{P.streak=0;inputVal="";var msg=(c.trap&&same(v,[c.trap.v,1]))?c.trap.m:"Ответ «"+esc(raw)+"» не подходит.";
  P.cur=make(Math.max(1,c.lvl-1),{easy:true});P.cur.fb={err:msg,hint:c.hint}}
 save();render();
}
function skip(){var P=PR(),c=P.cur;if(c.done)return;
 S.log.push({id:c.id,g:S.grade,tp:S.topic,q:c.q,giv:"—",ok:false,pts:0,t:Date.now()});
 P.total++;if(!c.diag)P.streak=0;c.done={ok:false,skip:true};save();render()}
function next(){var P=PR();inputVal="";
 if(P.cur&&P.cur.diag){P.diag.i++;
  if(P.diag.i>=3){P.diagDone=true;P.lvl=[1,2,3,4][P.diag.c];P.cur=null;view="diagres";save();return render()}
  P.cur=make(DL[P.diag.i],{diag:true})}
 else P.cur=make(P.lvl);
 save();render()}
function reset(){if(!resetArm){resetArm=true;document.getElementById("rs").textContent="Нажми ещё раз — точно сбросить";return}
 S={grade:S.grade,topic:null,p:{},log:[],nid:1};save();view="menu";resetArm=false;render()}
var app=document.getElementById("app");
function head(){return '<div class="top"><button class="ghost" onclick="go(\'menu\')">← Меню</button><button class="ghost" onclick="go(\'prog\')">📊 Прогресс</button></div>'}
function render(){window.scrollTo(0,0);
 if(view==="menu")return menu();if(view==="intro")return intro();if(view==="diagres")return diagres();if(view==="prog")return prog();play()}
function menu(){
 var h='<h1>🧮 Математика · 1 четверть</h1><p class="sub">⭐ Всего очков: <b>'+total()+'</b></p><div class="card"><b>Выбери класс</b><div class="row">';
 [4,5].forEach(function(g){h+='<button class="chip'+(S.grade===g?' on':'')+'" onclick="setG('+g+')">'+g+' класс</button>'});
 h+='</div></div><div class="card"><b>Выбери тему</b>';
 TOP.forEach(function(t){var p=S.p[S.grade+"-"+t.k];
  h+='<button class="tp" style="--c:'+t.c+'" onclick="pickT(\''+t.k+'\')"><span class="ic">'+t.i+'</span><span><b>'+t.n+'</b><small>'+(p&&p.diagDone?'Уровень '+p.lvl+' · ⭐ '+p.pts:p&&p.cur?'Продолжить':'Новая тема')+'</small></span></button>'});
 app.innerHTML=h+'</div>'}
function intro(){var t=topic(S.topic);
 app.innerHTML=head()+'<div class="card" style="border-top:6px solid '+t.c+'"><h1>'+t.i+' '+t.n+', '+S.grade+' класс</h1><div class="box meta">'+t.t+'</div><p class="note">🤫 Готовых ответов я не даю — только подсказки. Подумай сам, так запомнится лучше!</p><button class="pri" onclick="startDiag()">Проверим, что я уже знаю (3 задания)</button></div>'}
function diagres(){var P=PR(),t=topic(S.topic),c=P.diag.c;
 app.innerHTML=head()+'<div class="card center"><div class="big">'+['🌱','🌿','🌳','🏆'][c]+'</div><h1>Твой уровень по теме «'+t.n+'»</h1><p style="font-size:22px;font-weight:700;margin:6px 0">'+RANK[P.lvl-1]+'</p><p class="sub">Верно решено: '+c+' из 3</p>'+bar(P.lvl/5*100)+'<p class="sub" style="margin-top:12px">Тренировку начнём с уровня '+P.lvl+' из 5.</p><button class="pri" onclick="startPlay()">Начать тренировку →</button></div>'}
function play(){
 var P=PR(),c=P.cur,t=topic(S.topic),d=c.diag;
 var h=head()+'<div class="card"><div class="row sp"><b>'+t.i+' '+t.n+' · '+S.grade+' кл.</b><b>⭐ '+P.pts+'</b></div>';
 if(d)h+='<div class="sub l">Проверка знаний: задание '+(P.diag.i+1)+' из 3</div>'+bar(P.diag.i/3*100);
 else h+='<div class="sub l">Уровень '+P.lvl+' из 5 · '+RANK[P.lvl-1]+'</div>'+bar(((P.lvl-1)+P.streak/2)/5*100)+'<div class="sub l">'+(P.streak?'Ещё 1 верный ответ подряд — и уровень вырастет!':'2 верных ответа подряд — и задания станут сложнее')+'</div>';
 h+='</div><div class="card">';
 if(c.fb)h+='<div class="box err"><b>❌ '+c.fb.err+'</b><br>💡 Подсказка к прошлому заданию: '+c.fb.hint+'<br><small>А вот похожее задание попроще — попробуй его:</small></div>';
 h+='<div class="q">'+(c.easy?'🔁 ':'')+c.q+'</div>';
 if(c.hintUsed&&!c.done)h+='<div class="box hint">💡 '+c.hint+'</div>';
 if(showTopic&&!d)h+='<div class="box meta">'+t.t+'</div>';
 if(!c.done){
  h+='<input id="inp" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="Твой ответ" value="'+esc(inputVal)+'" onkeydown="if(event.key===\'Enter\')submit()"><div id="msg" class="msg"></div><button class="pri" onclick="submit()">Ответить</button><div class="row">'+(d?'':'<button onclick="hint()">💡 Подсказка</button><button onclick="tog()">📖 Тема</button>')+'<button onclick="skip()">⏭ Пропустить</button></div>';
 }else{
  var r=c.done;
  if(r.ok)h+='<div class="box good"><b>✅ Верно! +'+r.pts+' ⭐</b>'+(r.up===true?'<br>🚀 Новый уровень: '+P.lvl+' — '+RANK[P.lvl-1]+'!':r.up==="max"?'<br>🏆 Ты на самом высоком уровне!':'')+'</div>';
  else h+='<div class="box err"><b>'+(r.skip?'⏭ Пропущено.':'❌ Ответ не подошёл.')+'</b>'+(d?' Разберём это в тренировке.':'')+'</div>';
  h+='<button class="pri" onclick="next()">'+(d&&P.diag.i>=2?'Узнать мой уровень →':'Дальше →')+'</button>';
 }
 app.innerHTML=h+'</div>';
 var e=document.getElementById("inp");if(e&&!/Android|iPhone|iPad/i.test(navigator.userAgent))e.focus();
}
function prog(){
 var h=head()+'<h1>📊 Мой прогресс</h1><p class="sub">'+S.grade+' класс · ⭐ всего очков: <b>'+total()+'</b></p>';
 TOP.forEach(function(t){var p=S.p[S.grade+"-"+t.k];h+='<div class="card"><b>'+t.i+' '+t.n+'</b>';
  if(!p||(!p.total&&!p.diagDone))h+='<div class="sub l">Ещё не начато</div>';
  else h+='<div class="sub l">Уровень '+p.lvl+' · '+RANK[p.lvl-1]+' · ⭐ '+p.pts+' · верно '+p.ok+' из '+p.total+'</div>'+bar(p.lvl/5*100);
  h+='</div>'});
 var L=S.log.filter(function(e){return e.g===S.grade}).slice(-10).reverse();
 h+='<div class="card"><b>Последние ответы</b>';
 if(!L.length)h+='<div class="sub l">Пока пусто</div>';
 L.forEach(function(e){h+='<div class="li">'+(e.ok?'✅':'❌')+' '+e.q+' <i>→ '+esc(e.giv)+'</i>'+(e.pts?' <b>+'+e.pts+'</b>':'')+'</div>'});
 app.innerHTML=h+'</div><button class="ghost" id="rs" onclick="reset()">Сбросить весь прогресс</button>';
}
if(S.topic&&PR()&&PR().cur)view="play";
render();
</script>
</body>
</html>
